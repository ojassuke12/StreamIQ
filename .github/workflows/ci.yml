name: StreamIQ Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r backend/requirements.txt
        pip install pytest
    
    - name: Test app starts
      run: |
       cd backend
       python -c "from app.main import app; print('StreamIQ started successfully')"

        
    - name: Success
      run: echo "Pipeline completed successfully!"